name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      # Ubuntu's CPython ships with loadable SQLite extensions enabled, which
      # sqlite-vec needs; macOS runners and uv's managed builds do not.
      - run: uv sync --locked
      - run: uvx ruff check .
      - run: uv run python -m ingest.test_schema
      - run: uv run python -m ingest.test_chunk
      - run: uv run python -m server.test_retrieve
      - run: uv run python -m server.test_agent
      # Runners ship node, which the renderer escaping check needs.
      - run: uv run python -m server.test_app
