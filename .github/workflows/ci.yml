name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Every `uv run` in the justfile fails rather than re-locks if uv.lock is
    # stale, which is what `uv sync --locked` used to guarantee here.
    env: { UV_LOCKED: "1" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # just from Ubuntu's signed archive: no third-party action or PyPI
      # repackaging joins the supply chain for a task runner.
      - run: sudo apt-get install -y --no-install-recommends just
      # The recipes, not a copy of them. A hand-kept list here once dropped
      # server.test_web, the SSRF checks, without anything going red.
      # Runners ship node, which the renderer escaping check needs.
      - run: just check

  # Lint is not a security check. These two are, and they run on every PR
  # rather than waiting for Dependabot's monthly pass.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # gitleaks scans history, not just the working tree
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: sudo apt-get install -y --no-install-recommends just
      # pip-audit over uv.lock and gitleaks over the history, as `just audit`
      # runs them locally.
      - run: just audit
        env: { UV_LOCKED: "1" }
