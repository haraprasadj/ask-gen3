name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # Ubuntu's CPython ships with loadable SQLite extensions enabled, which
      # sqlite-vec needs; macOS runners and uv's managed builds do not.
      - run: uv sync --locked
      - run: uvx ruff check .
      - run: uv run python -m ingest.test_schema
      - run: uv run python -m ingest.test_chunk
      - run: uv run python -m server.test_retrieve
      - run: uv run python -m server.test_agent
      # Runners ship node, which the renderer escaping check needs.
      - run: uv run python -m server.test_app

  # Lint is not a security check. These two are, and they run on every PR
  # rather than waiting for Dependabot's monthly pass.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # gitleaks scans history, not just the working tree
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Known CVEs in the locked dependency set. `--locked` first, so the
      # environment audited is exactly uv.lock and nothing resolved fresh.
      - name: Dependency audit
        run: |
          uv sync --locked
          uv run --with pip-audit pip-audit --strict

      # The upstream image rather than a marketplace action: no license key for
      # organisations, no third-party action in the supply chain, digest-pinned
      # like everything else here.
      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source=/repo --redact --verbose
