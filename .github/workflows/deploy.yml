name: deploy
on:
  workflow_dispatch:
    inputs:
      index_run_id:
        description: "index workflow run to take index.db from (blank = latest successful)"
        required: false
  workflow_run:
    workflows: [index]
    types: [completed]

permissions:
  contents: read
  id-token: write        # OIDC — no service account key anywhere (SECURITY.md)

env:
  NAME: ask-gen3
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The index is a build artifact of a separate, slower pipeline (ADR-0005).
      # Deploys bake in whichever one is current rather than rebuilding it.
      - name: Fetch index.db
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.index_run_id || github.event.workflow_run.id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow index --status success -L 1 --json databaseId -q '.[0].databaseId')
          fi
          [ -n "$RUN_ID" ] || { echo "::error::no successful index run — run the index workflow first"; exit 1; }
          gh run download "$RUN_ID" -n index-db
          ls -lh index.db

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      # Cloud Build rather than a local docker build: Cloud Run is x86-only and
      # the build is native there. .gcloudignore keeps index.db in the upload,
      # which .gitignore would otherwise exclude (ADR-0008).
      - name: Build and push
        run: |
          gcloud builds submit \
            --tag "$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT }}/$NAME/app:${{ github.sha }}" \
            --region "$REGION" --project "${{ vars.GCP_PROJECT }}"

      - name: Deploy
        id: deploy
        run: |
          gcloud run deploy "$NAME" \
            --image "$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT }}/$NAME/app:${{ github.sha }}" \
            --region "$REGION" --project "${{ vars.GCP_PROJECT }}"
          URL=$(gcloud run services describe "$NAME" --region "$REGION" \
            --project "${{ vars.GCP_PROJECT }}" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # /healthz is reserved by Cloud Run's frontend and never reaches the
      # container; /health is the same handler (ADR-0008).
      - name: Verify
        run: |
          for i in $(seq 1 6); do
            BODY=$(curl -fsS --max-time 60 "${{ steps.deploy.outputs.url }}/health") && break || sleep 10
          done
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true' || { echo "::error::health not ok"; exit 1; }
          echo "$BODY" | grep -qv '"chunk_count":"0"' || { echo "::error::empty index"; exit 1; }
