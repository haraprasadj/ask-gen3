name: deploy
on:
  workflow_dispatch:
    inputs:
      index_run_id:
        description: "index workflow run to take index.db from (blank = latest successful)"
        required: false
  workflow_run:
    workflows: [index]
    types: [completed]

permissions:
  contents: read
  actions: read          # find and download index.db from the index run
  id-token: write        # OIDC — no service account key anywhere (SECURITY.md)
  attestations: write    # build provenance for the pushed image

env:
  NAME: ask-gen3
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The index is a build artifact of a separate, slower pipeline (ADR-0005).
      # Deploys bake in whichever one is current rather than rebuilding it.
      - name: Fetch index.db
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.index_run_id || github.event.workflow_run.id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow index --status success -L 1 --json databaseId -q '.[0].databaseId')
          fi
          [ -n "$RUN_ID" ] || { echo "::error::no successful index run — run the index workflow first"; exit 1; }
          gh run download "$RUN_ID" -n index-db
          ls -lh index.db

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Cloud Build rather than a local docker build: Cloud Run is x86-only and
      # the build is native there. .gcloudignore keeps index.db in the upload,
      # which .gitignore would otherwise exclude (ADR-0008).
      - name: Build and push
        id: build
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT }}/$NAME/app:${{ github.sha }}"
          # Async, then polled: streaming the logs reads Cloud Build's default
          # logs bucket, which needs project-wide Viewer. The deploy account
          # does not have that, and gets no broader role just to echo logs here.
          # The console link gcloud prints has them.
          BUILD=$(gcloud builds submit --tag "$IMAGE" --async --format='value(id)' \
            --region "$REGION" --project "${{ vars.GCP_PROJECT }}")
          while :; do
            STATUS=$(gcloud builds describe "$BUILD" --format='value(status)' \
              --region "$REGION" --project "${{ vars.GCP_PROJECT }}")
            case "$STATUS" in
              QUEUED|PENDING|WORKING) sleep 10 ;;
              SUCCESS) break ;;
              *) echo "::error::Cloud Build $BUILD finished $STATUS"; exit 1 ;;
            esac
          done
          # A tag is what we pushed; a digest is what actually runs. Everything
          # downstream — scan, SBOM, attestation — names the digest.
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE" \
            --project "${{ vars.GCP_PROJECT }}" --format='value(image_summary.digest)')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "repo_path=$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT }}/$NAME/app" >> "$GITHUB_OUTPUT"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      # Between the image being built and it serving traffic is the only place
      # a CVE gate can still stop a release. Dependabot catches the same things
      # a month later; this catches them now, and covers the base image too.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.repo_path }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true   # an unfixable CVE is not a reason to stop deploying
          exit-code: "1"

      # This project's whole claim is answers you can check against source. An
      # artifact nobody can trace back to a commit is an odd thing to ship with
      # that claim, so: an SBOM of what is in the image, and an attestation
      # binding the digest to this workflow run.
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.build.outputs.repo_path }}@${{ steps.build.outputs.digest }}
          artifact-name: sbom.spdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.repo_path }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Every setting the service runs with is on this command, not in console
      # state a redeploy would silently inherit.
      #
      # max-instances is a security control, not a performance one: the rate
      # limits in server/app.py are per-instance counters, so the real ceiling
      # is instances x limit. Two instances keeps that arithmetic honest and
      # bounds what an attacker can bill. The OpenRouter spend cap bounds model
      # spend; nothing else bounds Cloud Run spend.
      #
      # The hosted endpoint and model come from repository variables, passed
      # only when set; otherwise the server falls back to OpenRouter and the
      # ADR-0007 model. Switching providers is two variables and a redeploy.
      - name: Deploy
        id: deploy
        env:
          HOSTED_URL: ${{ vars.HOSTED_INFERENCE_URL }}
          HOSTED_MODEL: ${{ vars.HOSTED_INFERENCE_MODEL }}
        run: |
          gcloud run deploy "$NAME" \
            --image "${{ steps.build.outputs.repo_path }}@${{ steps.build.outputs.digest }}" \
            --region "$REGION" --project "${{ vars.GCP_PROJECT }}" \
            --allow-unauthenticated --ingress all \
            --max-instances 2 --concurrency 20 --cpu 1 --memory 2Gi --timeout 300 \
            --set-env-vars "PROVIDER=hosted${HOSTED_URL:+,HOSTED_INFERENCE_URL=$HOSTED_URL}${HOSTED_MODEL:+,HOSTED_INFERENCE_MODEL=$HOSTED_MODEL}" \
            --set-secrets "HOSTED_INFERENCE_API_KEY=${{ vars.HOSTED_INFERENCE_SECRET_NAME || 'openrouter-api-key' }}:latest"
          URL=$(gcloud run services describe "$NAME" --region "$REGION" \
            --project "${{ vars.GCP_PROJECT }}" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # /healthz is reserved by Cloud Run's frontend and never reaches the
      # container; /health is the same handler (ADR-0008).
      - name: Verify
        run: |
          for i in $(seq 1 6); do
            BODY=$(curl -fsS --max-time 60 "${{ steps.deploy.outputs.url }}/health") && break || sleep 10
          done
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true' || { echo "::error::health not ok"; exit 1; }
          echo "$BODY" | grep -qv '"chunk_count":"0"' || { echo "::error::empty index"; exit 1; }
