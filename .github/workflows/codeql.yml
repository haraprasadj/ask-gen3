# Static analysis. Advanced setup rather than GitHub's default setup, so the
# configuration is reviewed as a PR like everything else here.
#
# Python only: the page's JavaScript lives inside a string literal in
# server/app.py, which no JS extractor can see. What guards that code is
# server/test_app.py, which runs an injection payload through the real
# renderer under node.
#
# TODO: dormant. Code scanning is not enabled on this repository, so uploading
# results fails and every run goes red. The automatic triggers are removed
# until that is sorted; restore them in the same commit that enables it:
#
#   push: { branches: [main] }
#   pull_request:
#   schedule:
#     # A CVE in a code pattern lands without anyone pushing, so this also
#     # runs on a clock. Monday morning, offset off the hour.
#     - cron: "17 6 * * 1"
#
# Enabling means Settings -> Advanced Security -> Code scanning, choosing the
# advanced/workflow setup rather than default so this file stays in charge.
# On a private repo that is a paid add-on; making the repo public is free.
name: codeql
on:
  # Manual only. `on:` cannot be empty, and an empty one marks the whole
  # workflow invalid, which is the same red mark this is avoiding.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # codeql-action reads the workflow run it is part of; without this the
      # API call 403s and the job fails before analysis.
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
