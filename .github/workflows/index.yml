name: index
on:
  # Manual only. The corpus moves slowly and a stale index is not an outage,
  # so a weekly cron bought nothing and would auto-disable after 60 days idle.
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync --locked --group ingest
      - name: Build index
        env:
          GITHUB_TOKEN: ${{ github.token }}   # raises the API limit to 5000/hr
        run: uv run python -m ingest.build --out index.db
      - name: Summarise
        run: |
          ls -lh index.db
          uv run python -c "import sqlite3,os;d=sqlite3.connect('index.db');\
          print(dict(d.execute('select key,value from meta')));\
          print(d.execute('select count(*) from repos').fetchone()[0],'repos')" \
            >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: index-db
          path: index.db
          retention-days: 30
